<h2>Template</h2>
<hr>
@if (user()) {

    <p>{{user()?.name}}</p>
}

<ul class="list-group">
    @for(item of templateMenu; track item.ruta) {
    <li class="list-group-item" [routerLink]="[ item.ruta ]" routerLinkActive="active">
        {{ item.texto }}
    </li>

    }

</ul>

<h2 class="mt-3">Reactive</h2>
<hr>

<ul class="list-group">
    @for(item of reactiveMenu; track item.ruta) {
    <li class="list-group-item" [routerLink]="[ item.ruta ]"
        routerLinkActive="active">
        {{ item.texto }}
    </li>
    }

</ul>

<h2 class="mt-3">Registro</h2>
<hr>
<ul class="list-group">
    
    <li class="list-group-item" [routerLink]="[ '/auth/registro']" routerLinkActive="active">
        Registro
    </li>
    <li class="list-group-item" [routerLink]="[ '/auth/login']" routerLinkActive="active">Login</li>
</ul>
