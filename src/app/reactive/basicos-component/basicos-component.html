<h2>Template: Básicos</h2>
<hr>

<div class="row">
    <div class="col">

        <form [formGroup]="myForm" (ngSubmit)="submit()" autocomplete="off">

            <!-- Campo de producto -->
            <div class="mb-3 row">


                <label class="col-sm-3 col-form-label">Producto</label>


                <div class="col-sm-9">

                    <input 
                        type="text" 
                        class="form-control" 
                        placeholder="Nombre del producto"
                        formControlName="product"
                        >

                    @if (isValidField('product')) {
                        <span class="form-text text-danger">
                            {{getFieldError('product')}}
                        </span>

                    }



                </div>
            </div>







            <!-- Campo de producto -->
            <div class="mb-3 row">
                <label class="col-sm-3 col-form-label">Precio</label>
                <div class="col-sm-9">
                    <input type="number" class="form-control" placeholder="Precio del producto" formControlName="price">
                </div>
            </div>

            <!-- Campo de existencias -->
            <div class="mb-3 row">
                <label class="col-sm-3 col-form-label">Existencias</label>
                <div class="col-sm-9">
                    <input type="number" class="form-control" placeholder="Existencias del producto" formControlName="stock">
                </div>
            </div>


            <div class="row">
                <div class="col">
                    <button type="submit" class="btn btn-primary float-end">
                        Guardar
                    </button>
                </div>
            </div>



        </form>
        <div class="row">
            <div class="col">
                <span>Valid</span>
                <!-- Indica si el formulario es válido -->
                <pre>{{ myForm.valid }}</pre>

                <span>Pristine</span>
                <!-- Indica si el formulario está en el estado inicial -->
                <pre>{{ myForm.pristine }}</pre>

                <span>Touched</span>
                <!-- Indica si el formulario ha sido tocado, es decir
            si se ha tocado alguno de los campos -->
                <pre>{{ myForm.touched }}</pre>

                <span>Value</span>
                <pre>{{ myForm.value | json }}</pre>

                <span>Errores en existencias</span>
                <!-- Para poder utilizar el pipe json, hay que importarlo en el 
            componente JSONPipe -->
                <pre>{{ myForm.controls['precio']?.errors | json }}</pre>
            </div>
        </div>
    </div>
</div>
